# Pipeline CI/CD
#
# The advertised, tracked workflow for the GenLayer CI/CD toolkit. It runs the
# toolkit's own regression suite, verifies the package builds and installs
# cleanly, and verifies the deploy path wiring WITHOUT touching any network or
# requiring secrets (dry-run + guardrail negative checks).
#
# What this workflow deliberately does NOT do: it never runs a real deploy and
# never needs GENLAYER_PRIVATE_KEY. The regression suite is standard-library +
# pytest only, so it needs none of the external GenLayer toolchain
# (genvm-lint / gltest / genlayer), keeping CI fast and hermetic.

name: Pipeline CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------- #
  # 1. Regression tests: signer handling, address parsing, verification,     #
  #    ledger promotion, plus the zero-trace + config-resolution guards.     #
  # ----------------------------------------------------------------------- #
  test:
    name: Regression tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install toolkit + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run regression suite
        # PYTEST_DISABLE_PLUGIN_AUTOLOAD isolates the run from any globally
        # installed pytest plugins (e.g. the gltest runner) so the toolkit's
        # own tests are deterministic.
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest selftests/ -q --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: ignore

  # ----------------------------------------------------------------------- #
  # 2. Build verification: the package builds, its metadata is valid, and it #
  #    installs cleanly into a throwaway venv (delegated to validate_dist).  #
  # ----------------------------------------------------------------------- #
  build-verify:
    name: Build + package verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build wheel + sdist
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Deep-validate artifacts (contents + temp-venv install)
        run: bash tools/validate_dist.sh

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  # ----------------------------------------------------------------------- #
  # 3. Deploy verification: prove the deploy path is wired correctly without #
  #    a network or secrets. The dry-run prints the full plan; the guardrail #
  #    negative check asserts a deploy is REFUSED when the signer env is      #
  #    absent (exit code 2 = configuration error, not a stage failure).      #
  # ----------------------------------------------------------------------- #
  deploy-verify:
    name: Deploy path verification (dry-run + guardrail)
    runs-on: ubuntu-latest
    needs: build-verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.'

      - name: Self-check (toolkit is generic; print resolved config)
        run: genlayer-pipeline --self-check

      - name: Create a throwaway target project
        # The toolkit itself carries no contracts/ dir (it is target-agnostic),
        # so the deploy-path checks run against a minimal, single-contract
        # fixture. This exercises real config resolution + the deploy guardrail
        # gate without shipping a sample contract in the repo.
        run: |
          fixture="${RUNNER_TEMP}/fixture-project"
          mkdir -p "${fixture}/contracts" "${fixture}/tests/direct"
          printf 'from genlayer import *\n' > "${fixture}/contracts/sample.py"
          echo "FIXTURE=${fixture}" >> "${GITHUB_ENV}"

      - name: Dry-run the full 4-stage plan (runs nothing, touches no network)
        run: genlayer-pipeline --root "${FIXTURE}" --stages all --dry-run

      - name: Guardrail negative check - deploy must refuse without a signer
        # With no GENLAYER_* env set, a real (non-dry-run) deploy must fail closed
        # with the configuration exit code (2). If it does NOT, the guardrail
        # regressed and we fail the job loudly.
        env:
          GENLAYER_RPC_URL: ""
          GENLAYER_CHAIN_TYPE: ""
          GENLAYER_PRIVATE_KEY: ""
        run: |
          set +e
          genlayer-pipeline --root "${FIXTURE}" --stages deploy \
            --artifacts-dir "${RUNNER_TEMP}/deploy-art"
          code=$?
          set -e
          echo "deploy exit code with no signer env: ${code}"
          if [ "${code}" -ne 2 ]; then
            echo "::error::expected guardrail exit code 2, got ${code}"
            exit 1
          fi
          echo "guardrail correctly refused the deploy (exit 2)"
